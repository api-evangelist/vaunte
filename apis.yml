name: Vaunte
description: Vaunte was a New York fashion commerce startup, backed by Battery Ventures,
  that let shoppers buy items directly from the closets of socialites, stylists, editors,
  and models (the 2013 site billed itself as "Shop fashion closets of socialites, stylists,
  editors, and models"). The original marketplace is no longer operating, and today
  vaunte.com hosts an unrelated fashion and lifestyle content site with no API or
  developer surface. Tracked in the API Evangelist network as a Battery Ventures
  portfolio company.
